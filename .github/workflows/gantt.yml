name: Sync Gantt

on:
  schedule:
    - cron: "0 6 * * *"
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - milestoned
      - demilestoned
      - labeled
      - unlabeled
  milestone:
    types:
      - created
      - edited
      - closed
      - opened
      - deleted
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: gantt-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le Gantt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/gantt/sync_gantt.py --config .gantt.yml

      - name: Commit si le markdown a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --staged --quiet; then
            echo "Aucune modification du Gantt"
          else
            git commit -m "docs: régénérer le Gantt depuis les issues GitHub"
            git push
          fi
